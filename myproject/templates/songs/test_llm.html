{% extends 'base.html' %}

{% block title %}AI Song Lab - UTAMEMO Staff{% endblock %}

{% block content %}
<div class="ut-container">
    <!-- Header -->
    <div class="ut-header">
        <div class="ut-header-left">
            <h1>AI Song Lab</h1>
            <div class="ut-header-dots">
                <span class="ut-dot {% if inference_url %}ut-dot-pending{% else %}ut-dot-off{% endif %}" id="llmDot" title="LLM"></span>
            </div>
        </div>
        <a href="{% url 'songs:llm_guide' %}" class="ut-btn ut-btn-back">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Portal
        </a>
    </div>

    <!-- === STEP 1: LLM Lyrics Generation === -->
    <div id="step1Section">
        <!-- Server Status -->
        <div class="ut-panel ut-server-panel">
            <div class="ut-server-row">
                <div>
                    <h2>推論サーバー</h2>
                    <span class="ut-server-url" id="serverUrl">{{ inference_url|default:"未設定" }}</span>
                </div>
                <div id="serverStatus">
                    <span class="ut-badge ut-badge-pending">確認中...</span>
                </div>
            </div>
            <div id="serverDetails" class="ut-server-details" style="display:none;">
                <span class="ut-chip" id="srvEngine"></span>
                <span class="ut-chip" id="srvModel"></span>
                <span class="ut-chip" id="srvGpu"></span>
            </div>
        </div>

        <!-- Lyrics Generation Form -->
        <div class="ut-panel">
            <h2>Step 1 — 歌詞生成</h2>

            <label class="ut-label">学習テキスト</label>
            <textarea id="studyText" class="ut-textarea" rows="6" placeholder="歌詞にしたい学習内容を入力...&#10;例: 織田信長は1534年に尾張国で生まれた戦国武将。桶狭間の戦い(1560年)で今川義元を破り..."></textarea>

            <div class="ut-form-grid">
                <div>
                    <label class="ut-label">ジャンル</label>
                    <select id="llmGenre" class="ut-select">
                        <option value="pop" selected>Pop</option>
                        <option value="rock">Rock</option>
                        <option value="hip-hop">Hip-Hop</option>
                        <option value="EDM">EDM</option>
                        <option value="jazz">Jazz</option>
                        <option value="R&B">R&B</option>
                        <option value="folk">Folk</option>
                        <option value="J-pop">J-Pop</option>
                        <option value="K-pop">K-Pop</option>
                    </select>
                </div>
                <div>
                    <label class="ut-label">言語モード</label>
                    <select id="langMode" class="ut-select">
                        <option value="japanese" selected>日本語歌詞</option>
                        <option value="english">英語歌詞</option>
                        <option value="english_vocab">英語学習+日本語歌詞</option>
                        <option value="chinese">中国語歌詞</option>
                        <option value="chinese_vocab">中国語学習+日本語歌詞</option>
                    </select>
                </div>
                <div>
                    <label class="ut-label">バックエンド</label>
                    <select id="backendSelect" class="ut-select">
                        <option value="local" selected>ローカルLLM</option>
                        <option value="gemini">Gemini (比較用)</option>
                    </select>
                </div>
            </div>

            <label class="ut-label">カスタム指示 <span class="ut-hint">(任意)</span></label>
            <input type="text" id="customRequest" class="ut-input" placeholder="例: サビを特にキャッチーにして">

            <button id="step1Btn" class="ut-btn ut-btn-generate" onclick="generateLyrics()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                歌詞を生成
            </button>
        </div>

        <!-- Loading -->
        <div id="step1Loading" class="ut-panel ut-loading-panel" style="display:none;">
            <div class="ut-spinner"></div>
            <span class="ut-loading-text">推論サーバーで生成中... <b id="elapsedTime">0</b>秒</span>
        </div>

        <!-- Step 1 Error -->
        <div id="step1Error" class="ut-error" style="display:none;">
            <span class="ut-error-icon">x</span>
            <span id="step1ErrorText"></span>
        </div>

        <!-- Generated Lyrics Result -->
        <div id="lyricsResult" class="ut-panel ut-result-panel" style="display:none;">
            <div class="ut-result-header">
                <h2>生成された歌詞</h2>
                <div class="ut-result-meta">
                    <span class="ut-chip" id="resultMeta"></span>
                    <button class="ut-btn ut-btn-sm" onclick="copyLyrics()">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                        Copy
                    </button>
                </div>
            </div>
            <pre class="ut-lyrics-pre" id="resultLyrics"></pre>
            <button class="ut-btn ut-btn-sm" onclick="copyLyrics()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                Copy
            </button>
        </div>
    </div>
</div>

<!-- ========== STYLES ========== -->
<style>
.navbar-modern, .footer-modern { display: none !important; }
main { padding-top: 0 !important; }
.ut-container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem;
    min-height: 100vh;
}

/* Header */
.ut-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    padding-bottom: 1.2rem;
    border-bottom: 1px solid var(--border, oklch(90% 0.006 240));
}
.ut-header-left { display: flex; align-items: center; gap: 0.8rem; }
.ut-header h1 {
    font-size: 1.6rem; font-weight: 700; margin: 0;
    color: var(--fg, oklch(20% 0.02 240));
}
.ut-header-dots { display: flex; gap: 0.4rem; align-items: center; }
.ut-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ut-dot-ok { background: #16a34a; }
.ut-dot-off { background: var(--border, oklch(90% 0.006 240)); }
.ut-dot-pending { background: var(--muted, oklch(50% 0.018 240)); animation: dotPulse 1.5s infinite; }
@keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* Steps */
.ut-steps { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.5rem; }
.ut-step {
    display: flex; align-items: center; gap: 0.4rem;
    padding: 0.35rem 0.8rem; border-radius: 2rem;
    background: var(--surface, oklch(100% 0 0)); border: 1px solid var(--border, oklch(90% 0.006 240)); transition: all .3s;
}
.ut-step-active { border-color: var(--accent, oklch(56% 0.12 170)); }
.ut-step-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--bg, oklch(98% 0.004 240)); color: var(--muted, oklch(50% 0.018 240)); font-size: .75rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
}
.ut-step-active .ut-step-num { background: var(--fg, oklch(20% 0.02 240)); color: var(--surface, oklch(100% 0 0)); }
.ut-step-label { font-size: .8rem; color: var(--muted, oklch(50% 0.018 240)); font-weight: 500; }
.ut-step-active .ut-step-label { color: var(--fg, oklch(20% 0.02 240)); }
.ut-step-arrow { color: var(--border, oklch(88% 0.004 240)); display: flex; }

/* Panel */
.ut-panel {
    background: var(--surface, oklch(100% 0 0)); border: 1px solid var(--border, oklch(90% 0.006 240));
    border-radius: .6rem; padding: 1.2rem; margin-bottom: 1.2rem;
}
.ut-panel h2 {
    font-size: .85rem; font-weight: 600; color: var(--muted, oklch(50% 0.018 240));
    letter-spacing: .05em; margin: 0 0 .8rem;
}

/* Server */
.ut-server-panel { padding: 1rem 1.2rem; }
.ut-server-row { display: flex; justify-content: space-between; align-items: center; }
.ut-server-url { color: var(--muted, oklch(50% 0.018 240)); font-size: .75rem; font-family: 'SF Mono','Consolas',monospace; }
.ut-server-details { display: flex; gap: .5rem; margin-top: .6rem; flex-wrap: wrap; }

/* Badge & Chip */
.ut-badge { font-size: .75rem; font-weight: 600; padding: .25rem .6rem; border-radius: .3rem; }
.ut-badge-ok { background: rgba(22,163,74,0.08); color: #16a34a; }
.ut-badge-pending { background: var(--bg, oklch(98% 0.004 240)); color: var(--muted, oklch(50% 0.018 240)); }
.ut-badge-warn { background: rgba(217,119,6,0.08); color: #d97706; }
.ut-badge-err { background: rgba(220,38,38,0.06); color: #dc2626; }
.ut-badge-info { background: rgba(37,99,235,0.06); color: #2563eb; }
.ut-chip {
    font-size: .72rem; color: var(--muted, oklch(50% 0.018 240)); background: var(--bg, oklch(98% 0.004 240));
    padding: .25rem .5rem; border-radius: .25rem; border: 1px solid var(--border, oklch(90% 0.006 240));
}

/* Labels & Inputs */
.ut-label {
    display: block; font-size: .78rem; font-weight: 600; color: var(--muted, oklch(50% 0.018 240));
    margin: .7rem 0 .3rem; letter-spacing: .03em;
}
.ut-hint { color: var(--muted, oklch(50% 0.018 240)); font-weight: 400; }
.ut-textarea {
    width: 100%; background: var(--bg, oklch(98% 0.004 240)); border: 1px solid var(--border, oklch(90% 0.006 240));
    border-radius: .5rem; color: var(--fg, oklch(20% 0.02 240)); padding: .7rem;
    font-family: 'Inter',sans-serif; font-size: .82rem; line-height: 1.6;
    resize: vertical; outline: none; box-sizing: border-box;
}
.ut-textarea:focus { border-color: var(--accent, oklch(56% 0.12 170)); }
.ut-textarea-mono { font-family: 'SF Mono','Consolas',monospace; line-height: 1.7; }
.ut-input, .ut-select {
    width: 100%; background: var(--bg, oklch(98% 0.004 240)); border: 1px solid var(--border, oklch(90% 0.006 240));
    border-radius: .4rem; color: var(--fg, oklch(20% 0.02 240)); padding: .45rem .7rem;
    font-size: .82rem; outline: none; box-sizing: border-box;
}
.ut-input:focus, .ut-select:focus { border-color: var(--accent, oklch(56% 0.12 170)); }
.ut-select { cursor: pointer; }

/* Form grid */
.ut-form-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: .8rem; margin-bottom: .3rem; }
@media (max-width:600px) { .ut-form-grid { grid-template-columns: 1fr; } }

/* Grid (Step 2) */
.ut-grid { display: grid; grid-template-columns: 1fr 320px; gap: 1.5rem; }
@media (max-width:768px) { .ut-grid { grid-template-columns: 1fr; } }

/* Buttons */
.ut-btn {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .45rem .8rem; border: 1px solid var(--border, oklch(90% 0.006 240)); border-radius: .5rem;
    background: var(--surface, oklch(100% 0 0)); color: var(--muted, oklch(50% 0.018 240)); cursor: pointer;
    font-size: .82rem; font-weight: 500; text-decoration: none; transition: all .15s;
}
.ut-btn:hover { color: var(--fg, oklch(20% 0.02 240)); border-color: var(--fg, oklch(20% 0.02 240)); }
.ut-btn-sm { font-size: .76rem; padding: .3rem .6rem; }
.ut-btn-generate {
    width: 100%; margin-top: 1rem; padding: .7rem; justify-content: center;
    font-size: .9rem; font-weight: 600;
    background: var(--fg, oklch(20% 0.02 240)); border: none; color: var(--surface, oklch(100% 0 0));
}
.ut-btn-generate:hover { opacity: .85; color: var(--surface, oklch(100% 0 0)); }
.ut-btn-generate:disabled { opacity: .35; cursor: not-allowed; }
.ut-btn-proceed {
    width: 100%; margin-top: .8rem; padding: .6rem; justify-content: center;
    font-size: .85rem; font-weight: 600;
    background: rgba(22,163,74,0.08); border: 1px solid rgba(22,163,74,0.25); color: #16a34a;
}
.ut-btn-proceed:hover { background: rgba(22,163,74,0.12); color: #15803d; }
.ut-btn-back-step { margin-bottom: 1.2rem; color: var(--muted, oklch(50% 0.018 240)); border-color: var(--border, oklch(90% 0.006 240)); background: var(--surface, oklch(100% 0 0)); }
.ut-btn-generating { pointer-events: none; position: relative; overflow: hidden; }
.ut-btn-generating::after {
    content: ''; position: absolute; top: 0; left: -100%;
    width: 200%; height: 100%;
    background: linear-gradient(90deg,transparent,rgba(0,0,0,.04),transparent);
    animation: shimmer 1.5s infinite;
}
@keyframes shimmer { 100% { left: 100%; } }

/* Loading */
.ut-loading-panel { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.2rem; }
.ut-spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border, oklch(90% 0.006 240)); border-top-color: var(--accent, oklch(56% 0.12 170));
    border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ut-loading-text { color: var(--muted, oklch(50% 0.018 240)); font-size: .85rem; }

/* Lyrics result */
.ut-result-panel { border-color: rgba(22,163,74,0.2); }
.ut-result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
.ut-result-meta { display: flex; align-items: center; gap: .5rem; }
.ut-lyrics-pre {
    background: var(--bg, oklch(98% 0.004 240)); border: 1px solid var(--border, oklch(90% 0.006 240)); border-radius: .4rem;
    padding: .8rem; color: var(--fg, oklch(20% 0.02 240)); font-family: 'SF Mono','Consolas',monospace;
    font-size: .82rem; line-height: 1.7; white-space: pre-wrap;
    max-height: 500px; overflow-y: auto; margin: 0;
}

/* Status */
.ut-status-panel { padding: 1rem 1.2rem; }
.ut-progress-bar { width: 100%; height: 4px; background: var(--bg, oklch(96% 0.004 240)); border-radius: 2px; overflow: hidden; margin-bottom: .6rem; }
.ut-progress-fill { height: 100%; width: 0%; background: var(--accent, oklch(56% 0.12 170)); border-radius: 2px; transition: width .5s ease; }
.ut-status-text { color: var(--muted, oklch(50% 0.018 240)); font-size: .85rem; }
.ut-prompt-used { margin-top: .4rem; font-size: .72rem; color: var(--muted, oklch(50% 0.018 240)); font-family: 'SF Mono',monospace; word-break: break-all; }

/* Song result */
.ut-song-result { border-color: rgba(22,163,74,0.2); }
.ut-player-wrap { margin-bottom: .8rem; }
.ut-audio { width: 100%; border-radius: .5rem; outline: none; }
.ut-result-info { display: flex; flex-wrap: wrap; gap: .5rem; }

/* Error */
.ut-error {
    background: rgba(220,38,38,.04); border: 1px solid rgba(220,38,38,.15);
    border-radius: .6rem; padding: .8rem 1rem; color: #dc2626;
    font-size: .85rem; display: flex; align-items: center; gap: .5rem; margin-bottom: 1.2rem;
}
.ut-error-icon { font-weight: 700; font-size: 1rem; }
.ut-warning-mini { margin-top: .6rem; font-size: .75rem; color: #dc2626; text-align: center; }
</style>

<!-- ========== SCRIPTS ========== -->
<script>
const CSRF = '{{ csrf_token }}';
const HEALTH_URL = '{% url "songs:test_llm_health" %}';
const LLM_GEN_URL = '{% url "songs:test_llm_generate" %}';

let timerInterval = null;
let healthTimer = null;

// Init
document.addEventListener('DOMContentLoaded', () => {
    checkHealth();
});

// === Health Check ===
async function checkHealth() {
    const statusEl = document.getElementById('serverStatus');
    const llmDot = document.getElementById('llmDot');
    if (healthTimer) { clearTimeout(healthTimer); healthTimer = null; }
    try {
        const resp = await fetch(HEALTH_URL, { headers: {'X-CSRFToken': CSRF} });
        const data = await resp.json();
        const det = document.getElementById('serverDetails');
        if (data.online) {
            statusEl.innerHTML = '<span class="ut-badge ut-badge-ok">Online</span>';
            llmDot.className = 'ut-dot ut-dot-ok';
            det.style.display = 'flex';
            document.getElementById('srvEngine').textContent = 'Engine: ' + (data.engine || '-');
            document.getElementById('srvModel').textContent = 'Model: ' + (data.base_model || '-');
            document.getElementById('srvGpu').textContent = 'GPU: ' + (data.gpu || '-');
        } else if (data.training) {
            const label = data.training_status === 'generating' ? 'データ生成中' : '学習中';
            statusEl.innerHTML = '<span class="ut-badge ut-badge-warn">' + label + '</span>';
            llmDot.className = 'ut-dot ut-dot-off';
            det.style.display = 'flex';
            document.getElementById('srvEngine').textContent = '';
            document.getElementById('srvModel').textContent = 'GPU学習中 — Geminiは利用可能';
            document.getElementById('srvGpu').textContent = '';
        } else if (data.starting) {
            statusEl.innerHTML = '<span class="ut-badge ut-badge-info">起動中...</span>';
            llmDot.className = 'ut-dot ut-dot-pending';
            det.style.display = 'flex';
            document.getElementById('srvEngine').textContent = '';
            document.getElementById('srvModel').textContent = '推論サーバー起動中...';
            document.getElementById('srvGpu').textContent = '';
            healthTimer = setTimeout(checkHealth, 15000);
        } else {
            statusEl.innerHTML = '<span class="ut-badge ut-badge-err">Offline</span>';
            llmDot.className = 'ut-dot ut-dot-off';
            det.style.display = 'flex';
            document.getElementById('srvEngine').textContent = '';
            document.getElementById('srvModel').textContent = 'エージェント未起動 — Geminiは利用可能';
            document.getElementById('srvGpu').textContent = '';
        }
    } catch(e) {
        statusEl.innerHTML = '<span class="ut-badge ut-badge-err">Error</span>';
        llmDot.className = 'ut-dot ut-dot-off';
    }
}

// === Step 1: Lyrics Generation ===
async function generateLyrics() {
    const text = document.getElementById('studyText').value.trim();
    if (!text) { alert('学習テキストを入力してください'); return; }

    const btn = document.getElementById('step1Btn');
    const loading = document.getElementById('step1Loading');
    const resultEl = document.getElementById('lyricsResult');
    const errEl = document.getElementById('step1Error');
    const elapsed = document.getElementById('elapsedTime');

    btn.disabled = true;
    btn.innerHTML = 'Generating...';
    btn.classList.add('ut-btn-generating');
    loading.style.display = 'flex';
    resultEl.style.display = 'none';
    errEl.style.display = 'none';

    let sec = 0;
    elapsed.textContent = '0';
    timerInterval = setInterval(() => { sec++; elapsed.textContent = sec; }, 1000);

    try {
        const res = await fetch(LLM_GEN_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF },
            body: JSON.stringify({
                text: text,
                genre: document.getElementById('llmGenre').value,
                language_mode: document.getElementById('langMode').value,
                custom_request: document.getElementById('customRequest').value,
                backend: document.getElementById('backendSelect').value,
            }),
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('resultLyrics').textContent = data.lyrics;
            const meta = [];
            if (data.generation_time) meta.push(data.generation_time + 's');
            if (data.backend) meta.push(data.backend);
            document.getElementById('resultMeta').textContent = meta.join(' | ');
            resultEl.style.display = 'block';
        } else {
            errEl.style.display = 'flex';
            document.getElementById('step1ErrorText').textContent = data.error || '生成に失敗しました';
        }
    } catch(e) {
        errEl.style.display = 'flex';
        document.getElementById('step1ErrorText').textContent = '通信エラー: ' + e.message;
    } finally {
        clearInterval(timerInterval);
        loading.style.display = 'none';
        btn.disabled = false;
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg> 歌詞を生成';
        btn.classList.remove('ut-btn-generating');
    }
}

function copyLyrics() {
    const text = document.getElementById('resultLyrics').textContent;
    navigator.clipboard.writeText(text).then(() => {
        const btn = event.target.closest('button');
        const orig = btn.innerHTML;
        btn.innerHTML = 'Copied';
        setTimeout(() => btn.innerHTML = orig, 1500);
    });
}

</script>
{% endblock %}
